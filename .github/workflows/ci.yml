name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (Python)
        run: uv run ruff check src/

      - name: Test
        run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install webapp deps
        run: npm ci
        working-directory: webapp

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: webapp

      - name: Run Playwright e2e tests
        run: npx playwright test
        working-directory: webapp

  build-native:
    runs-on: windows-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: tauri-apps/setup-tauri@v2

      - run: pip install pyinstaller

      - run: npm --prefix webapp ci && npm --prefix webapp run build

      - run: |
          pyinstaller --onedir --name discord-mcp-backend `
            --add-data "src/discord_mcp;discord_mcp" `
            --copy-metadata fastmcp `
            run_server.py

      - run: |
          move "dist\discord-mcp-backend\discord-mcp-backend.exe" `
            "native\binaries\discord-mcp-backend-x86_64-pc-windows-msvc.exe"

      - run: npx tauri build
        working-directory: native

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: native/target/release/bundle/nsis/*.exe
