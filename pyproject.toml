[project]
name = "discord-mcp"
version = "0.3.0"
description = "FastMCP 3.2 Discord MCP server with sampling, agentic workflow, and SOTA webapp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "lancedb>=0.4.0",
    "sentence-transformers>=3.0.0",
    "pyarrow>=14.0.0",
    "prefab-ui>=0.14.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=5.0", "ruff>=0.16.0,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["discord_mcp"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/discord_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration test that hits a running backend (use -m live or set DISCORD_LIVE_TEST=1)",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
